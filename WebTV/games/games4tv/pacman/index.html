var webtv = 0;

if (navigator.appName.toLowerCase().indexOf('webtv') != -1) {
	webtv = 1;

else if (navigator.appName.toLowerCase().indexOf('netscape') != -1) {

var cook = document.cookie.split('; ');
var now  = new Date();

function getCookie(cookname) {
	for (var i=0; i<cook.length; i++) {
		chip = cook[i].split('=');
		if (chip[0] == cookname) {
			return unescape(chip[1]);
		}
	}
	return 10000;
}

function setCookie(cookname, cookval) {
	var exp  = new Date(now.getTime() + 365*24*60*60*1000);
	if (cookval != null && cookval != '') {
		document.cookie = cookname + '=' + escape(cookval) + '; expires = ' + exp.toGMTString();
		cook = document.cookie.split('; ');
	}
}

function getAll() {
	highscore = getCookie('vbhigh');
	set_high(highscore);
}

// Check for WebTV onkeypress support
var onkeypress_enabled = 0;
if (browse == 'wtv') {
	var check = event.keyCode;
	if (check != null && check != undefined) {
		onkeypress_enabled = 1;
	}
}

window.document.onkeypress = key_press;

if (document.layers) {
	document.captureEvents(Event.KEYPRESS);
}

window.onerror = quit;

function quit() {
	return true;
}

function cyc() {
	var tx = document.c.d.value.toLowerCase();
	document.c.d.value = '';
	if (tx == 'a') {
		go_left();
	} else if (tx == 'c') {
		showC();
	} else if (tx == 'w') {
		go_up();
	} else if (tx == 'd') {
		go_right();
	} else if (tx == 's') {
		go_down();
	}
}

function process_command(key) {
	if (key == 13) {
		start_game();
	} else if (key == 97) {
		go_left();
	} else if (key == 99) {
		showC();
	} else if (key == 119) {
		go_up();
	} else if (key == 100) {
		go_right();
	} else if (key == 115) {
		go_down();
	}
}

function key_press(e) {
	var key = 0;
	if (document.layers) {
		key = e.which;
	} else if (document.all) {
		key = window.event.keyCode;
	}
	process_command(key);
}

function n_up(who, what) {
	eval("document." + who + "1.document." + who + "2.document.open();");
	eval("document." + who + "1.document." + who + "2.document.write('<font color=white face=Arial>" + what + "</b></font>');");

function set_score(num) {
	if (browse == 'ns') {
		n_up('score', num);
	} else {
		document.pacman.score.value = num;
	}
}

function set_high(num) {
	if (browse == 'ns') {
		n_up('high', num);
	} else {

	}
}

function set_paused(txt) {
	if (browse == 'ns') {
		n_up('paused', txt);
	} else {
		document.pacman.paused.value = txt;
	}
}

function add_score(txt) {
	points += txt;
	if (points >= 10000 && extras == 0) {
		one_up();
	} else if (points >= 25000 && extras == 1) {
		one_up();
	} else if (points >= 50000 && extras == 2) {
		one_up();
	} else if (points >= 100000 && extras == 3) {
		one_up();
	}
	if (points > highscore) {
		highscore = points;
		set_high(points);
	}
	set_score(points);
}

function one_up() {
	extras++;
	lives++;
	adjust_lives();
}

function get_bonus() {
	alert('Level ' + level + ' cleared!');
	level++;
	lives++;
	var bonus = lives * 500;
	add_score(bonus);
	alert('Bonus: ' + bonus + ' pts');
	if (g_speed > 3000) {
		g_speed -= 1000;
	}
}

function start_game() {
	if (start == 0) {
		lives--;
		adjust_lives();
		alert('Level ' + level + '\n\nGood luck!');
		pause = 0;
		cycle();
	} else {
		if (pause == 0) {
			clearTimeout(tmr);
			pause = 1;
			set_paused('* Paused *');
		} else if (pause == 1) {
			pause = 0;
			set_paused('');
			cycle();
		}
	}
}

function cycle() {
	// *** Start Pacman's Routine ***
	var raninto = 0;
	start = 1;
	var jump = 0;
	var temp_pos_x = pos_x;
	var temp_pos_y = pos_y;
	curr = maze[pos_x][pos_y];
	if (curr == 4) {
		curr = 3;
	}
	if (dir == 'left') {
		temp_pos_y--;
	} else if (dir == 'up') {
		temp_pos_x--;
	} else if (dir == 'right') {
		temp_pos_y++;
	} else if (dir == 'down') {
		temp_pos_x++;
	}
	for (var i=0; i<warp.length; i++) {
		if (pos_x == warp[i][0] && pos_y == warp[i][1] && dir == warp[i][2]) {
			temp_pos_x = warp[i][3];
			temp_pos_y = warp[i][4];
			i = warp.length;
			jump = 1;
		}
	}
	var check = maze[temp_pos_x][temp_pos_y];
	if ((jump == 1 || (check != 0 && check < 5)) && dir != 0) {
		if (temp_pos_x == red_pos_x && temp_pos_y == red_pos_y) { // *** Ran into Red ***
			if (red_suit.substring(0,4) == "blue") {
				reset_red();
			} else {
				got_hit();
				return;
			}
		}
		if (temp_pos_x == pink_pos_x && temp_pos_y == pink_pos_y) { // *** Ran into Pink ***
			if (pink_suit.substring(0,4) == "blue") {
				reset_pink();
			} else {
				got_hit();
				return;
			}
		}
		if (temp_pos_x == orange_pos_x && temp_pos_y == orange_pos_y) { // *** Ran into Orange ***
			if (orange_suit.substring(0,4) == "blue") {
				reset_orange();
			} else {
				got_hit();
				return;
			}
		}
		if (temp_pos_x == purple_pos_x && temp_pos_y == purple_pos_y) { // *** Ran into Purple ***
			if (purple_suit.substring(0,4) == "blue") {
				reset_purple();
			} else {
				got_hit();
				return;
			}
		}
		if (temp_pos_x == cherry_pos_x && temp_pos_y == cherry_pos_y) { // *** Ran into Cherry ***
			reset_cherry();
		}
		if (check == 1) { // *** Found a Pellet ***
			maze[temp_pos_x][temp_pos_y] = 3;
			curr = 3;
			add_score(50);
			check_pellets();
			if (total_pellets == 0) {
				get_bonus();
				reset_all();
				reset_board();
				return;
			}
		}
		if (check == 2) { // *** Found a Super Pellet ***
			maze[temp_pos_x][temp_pos_y] = 3;
			curr = 3;
			add_score(100);
			check_pellets();
			if (total_pellets == 0) {
				get_bonus();
				reset_all();
				reset_board();
				return;
			}
			super_pellet();
		}
		show_image(pos_x, pos_y, "img"+curr);
		pos_x = temp_pos_x;
		pos_y = temp_pos_y;
		show_image(pos_x, pos_y, "pac_"+dir);
	}

	// *** Start Red's Routine ***
	jump = 0;
	temp_pos_x = red_pos_x;
	temp_pos_y = red_pos_y;
	curr = maze[red_pos_x][red_pos_y];
	if (curr > 3) {
		if (curr > 4) {
			temp_pos_x = 6;
			temp_pos_y = 6;
			jump = 1;
		}
		curr = 3;
	}
	if (red_dir == 'left') {
		temp_pos_y--;
	} else if (red_dir == 'up') {
		temp_pos_x--;
	} else if (red_dir == 'right') {
		temp_pos_y++;
	} else if (red_dir == 'down') {
		temp_pos_x++;
	}
	for (var i=0; i<warp.length; i++) {
		if (red_pos_x == warp[i][0] && red_pos_y == warp[i][1] && red_dir == warp[i][2]) {
			temp_pos_x = warp[i][3];
			temp_pos_y = warp[i][4];
			i = warp.length;
			jump = 1;
		}
	}
	if (temp_pos_x == pos_x && temp_pos_y == pos_y) { // *** Ran into Pacman ***
		if (red_suit.substring(0,4) == 'blue') {
			raninto = 1;
			reset_red();
		} else {
			got_hit();
			return;
		}
	}
	check = maze[temp_pos_x][temp_pos_y];
	if (raninto == 0 && (jump == 1 || (check != 0 && check < 5))) {
		show_image(red_pos_x, red_pos_y, 'img' + curr);
		red_pos_x = temp_pos_x;
		red_pos_y = temp_pos_y;
		show_image(red_pos_x, red_pos_y, red_suit);
	}
	var new_dir = 0;
	var num = 0;
	if (raninto == 0) {
		while (new_dir == 0) {
			num = Math.round(Math.random() * 3);
			if (red_pos_y > 0) {
				if (num == 0 && maze[red_pos_x][red_pos_y-1] != 0 && maze[red_pos_x][red_pos_y-1] < 5) {
					if (red_dir == 'right') {
						new_dir = 'right';
					} else {
						new_dir = "left";
					}
					red_dir = new_dir;
				}
			}
			if (red_pos_x > 0) {
				if (num == 1 && maze[red_pos_x-1][red_pos_y] != 0 && maze[red_pos_x-1][red_pos_y] < 5) {
					if (red_dir == 'down') {
						new_dir = 'down';
					} else {
						new_dir = 'up';
					}
					red_dir = new_dir;
				}
			}
			if (red_pos_y < 12) {
				if (num == 2 && maze[red_pos_x][red_pos_y+1] != 0 && maze[red_pos_x][red_pos_y+1] < 5) {
					if (red_dir == 'left') {
						new_dir = 'left';
					} else {
						new_dir = 'right';
					}
					red_dir = new_dir;
				}
			}
			if (red_pos_x < 16) {
				if (num == 3 && maze[red_pos_x+1][red_pos_y] != 0 && maze[red_pos_x+1][red_pos_y] < 5) {
					if (red_dir == 'up') {
			            new_dir = 'up';
					} else {
			            new_dir = 'down';
					}
					red_dir = new_dir;
				}
			}
		}
	}

	// *** Start Pink's Routine ***
	jump = 0;
	raninto = 0;
	temp_pos_x = pink_pos_x;
	temp_pos_y = pink_pos_y;
	curr = maze[pink_pos_x][pink_pos_y];
	if (curr > 3) {
		if (curr > 4) {
			temp_pos_x = 6;
			temp_pos_y = 6;
			jump = 1;
		}
		curr = 3;
	}
	if (pink_dir == 'left') {
		temp_pos_y--;
	} else if (pink_dir == 'up') {
		temp_pos_x--;
	} else if (pink_dir == 'right') {
		temp_pos_y++;
	} else if (pink_dir == 'down') {
		temp_pos_x++;
	}
	for (var i=0; i<warp.length; i++) {
		if (pink_pos_x == warp[i][0] && pink_pos_y == warp[i][1] && pink_dir == warp[i][2]) {
			temp_pos_x = warp[i][3];
			temp_pos_y = warp[i][4];
			i = warp.length;
			jump = 1;
		}
	}
	if (temp_pos_x == pos_x && temp_pos_y == pos_y) { // *** Ran into Pacman ***
		if (pink_suit.substring(0,4) == 'blue') {
			reset_pink();
			raninto = 1;
		} else {
			got_hit();
			return;
		}
	}
	check = maze[temp_pos_x][temp_pos_y];
	if (raninto == 0 && (jump == 1 || (check != 0 && check < 5))) {
		show_image(pink_pos_x, pink_pos_y, 'img' + curr);
