<!--
This loads and matches pairs of identical images.
-->
<script src="scripts/fish.js"></script>
<script>


var score = 0;
var movecount = 0;

var places = rows*cols;

var grid = new Array();
for (var i = 0; i < rows; i++) {
		grid[i] = new Array();
		}



function Spot(r,c) {
	this.r = r;
	this.c = c;
	this.state=0;
}

function spot(r,c) {
	c = new Spot(r,c);
	return c;
}

var noSpot = spot(-1,-1);

var pair = new Array(noSpot,noSpot);

//basic setup functions for games
var pieces = new Array();for (var i = 0; i < places; i++) {pieces[i] = new Piece(i);}
function shuffle() {for (var i = 0; i < places; i++) {var tempndx = get_rand(places);var temp1 = pieces[i];var temp2 = pieces[tempndx];pieces[i] = temp2;pieces[tempndx] = temp1;}}

function deal() {
	var indx = 0;
	for (var i = 0; i < rows; i++) {
		for (var j = 0; j < cols; j++) {
			grid[i][j] = pieces[indx]; //pieces.pop();
			grid[i][j].loc = spot(i,j);
			indx++;
		}
	}	
}

function display() {
	for (var i = 0; i < rows; i++) {
		for (var j = 0; j < cols; j++) {
		document.images["i"+ i+":"+j].src = back[i][j].src;
		}
	}
}

function show(place) {
	document.images["i"+ place.r+":"+place.c].src = grid[place.r][place.c].face.src;
}

//these accept the pair number, 1 or 0, and derive where they are, then hide or clear them
function hide(num) {
	place=pair[num];
	document.images["i"+ place.r+":"+place.c].src = back[place.r][place.c].src;
	pair[num] = noSpot;
}

function clearit(num) {
	place=pair[num];
	grid[place.r][place.c].loc.state=1;
	document.images["i"+ place.r+":"+place.c].src = blank.src;
	pair[num] = noSpot;	
}

function setup() {
	shuffle();
	deal();
	display();
}

//game operation

function click(r,c) {
	if (grid[r][c].loc.state == 0) { //traps for already cleared tiles
		if (pair[0].r == -1) {
			pair[0] = grid[r][c].loc;
			show(pair[0]);
		}
		else if ((pair[1].r == -1) && !(pair[0].r == r && pair[0].c == c)) {
			pair[1] = grid[r][c].loc;
			show(pair[1]);		
			checkMatch();
			
		}
	}	
}

function checkMatch() {
	movecount++;
	//tests state for match; could be changed to test any property
	if (grid[pair[0].r][pair[0].c].state == grid[pair[1].r][pair[1].c].state) {
		//tellme("match!");
		scoreit();
		setTimeout("clearit(0); clearit(1)",1000); 
	}
	else {
		setTimeout("hide(0); hide(1)",1000); 
	}	
}

function scoreit() {
	score++;
	if (score == places/2) win();

}

function win() {
	tellme("solved in "+movecount+" moves!");
}


//utility
function ndx(r,c) {return (r * cols)+c;}
function get_rand(seed) {return Math.floor((seed-1)*Math.random());}

//debugging

function tellme(str) {
	//temptext = document.listing.tracker.value;
	//document.listing.tracker.value= temptext + str + "\n";
	}

</script>
