else {

color_5.src = "elements/i5.gif";
color_6.src = "elements/i6.gif";
high_0.src = "elements/i0h.gif";
high_1.src = "elements/i1h.gif";
high_2.src = "elements/i2h.gif";
high_3.src = "elements/i3h.gif";
high_4.src = "elements/i4h.gif";
high_5.src = "elements/i5h.gif";
high_6.src = "elements/i6h.gif";
blank.src = "elements/blank.gif";
}

var sound_0 = "resources/tock.mid";
var sound_1 = "resources/ding.mid";
var sound_2 = "resources/chink.mid";
var sound_3 = "resources/timp.mid";
var sound_4 = "resources/ping.mid";
var sound_5 = "resources/timp.mid";
var sound_6 = "resources/ping.mid";
var cleared_cells = 0;
var grid = new Array(numcells*numrows);
var testcolor;
var testndx = 0;
var recurtile;
var recurfnd ;
var recurfndx = 0;
var level = 1;
total_score=0;
var won = false;
var numcolors; //start with 3 colors
var cookiename = "dotscore";
var hascookie = false;

function getCookieVal(offset) {
	hascookie = true;
	var endstr = document.cookie.indexOf(";", offset);
	if (endstr == -1) endstr = document.cookie.length;
	return document.cookie.substring(offset, endstr);
}

function getCookie(name) {
	var arg = name + "=";
	var alen = arg.length;
	var clen = document.cookie.length;
	var i = 0;
	while (i < clen) {
		var j = i + alen;
		if (document.cookie.substring(i,j) == arg) return getCookieVal(j);
			i = document.cookie.indexOf(" ", i) + 1;
			if (i==0) break;
	}
	return null;
}

function splitCookie(cookiedata) {
	if (hascookie) {
	var splitpoint = cookiedata.indexOf("x");
	var temp = parseInt(cookiedata.substring(0, splitpoint));
	total_score = temp;
	temp = parseInt(cookiedata.charAt(splitpoint+1));
	level = temp;
	}
}

var mycookie = getCookie(cookiename);

function setcookie(a,b) {
	document.cookie = "dotscore= " + a + "x" + b;
}

function setup_grid() {
	message("");
	splitCookie(mycookie);
	score = 0;
	recurfndx = 0;
	numcolors = level+2;
	recurtile = new Array();
	recurfnd = new Array();
	cleared_cells = 0;
	for (var n = 0;n < numrows; n++) {
		for (var m = 0; m < numcells; m++) {
		var randnum = Math.floor(Math.random()*numcolors);
		//document.images["t" + n + ":" + m].src = eval("color_" + randnum + ".src");
		grid[(n*numcells)+m] = randnum;
		}
	}
	draw_grid();
	message("New game, level " + level + " with " + numcolors + " colors!");
}

function can_change(r,c) {
	var ndx = r*numcells + c;
	if (grid[ndx] > -1) {
	if (((c < numcells-1) && (grid[ndx+1] == grid[ndx])) || ((c > 0) && (grid[ndx-1] == grid[ndx])) || ((r < numrows-1) && (grid[ndx + numcells] == grid[ndx])) || ((r > 0) && (grid[ndx-numcells] == grid[ndx]))){
	return true;
	}
	}
	return false;
}

function hilite(r,c) {
	if (can_change(r,c)) document.images["t" + r + ":" + c].src = eval("high_" + grid[r*numcells + c] + ".src");
}

function game_over() {
	for (var n = 0;n < numrows; n++) {
		for (var m = 0; m < numcells; m++) {
			if (can_change(n,m)) {
			return false;
				}
			}
		}
	return true;
}

function score_it() {
	var sc = (recurfndx < 3) ? 0:(recurfndx-2)*level;
	score = score + ((recurfndx-2+level)*sc);
	if (cleared_cells == (numrows*numcells)) {
		score = score + (500*level);
		won = true;
		}
	else message("That move collected " + recurfndx + " dots, scoring " + ((recurfndx-2+level)*sc) + ". Score is " + score);
}

function clicked(x,y) {
	if (!can_change(x,y)) return;
	var n = 0;
	testcolor=grid[(x*numcells)+y];
	for (n = 0; n < numrows*numcells; n++) {
		recurtile[n]= grid[n];
		} //set up the test array to match the current array
	recurfndx = 0; //where the array of found matches will begin
	recur((x*numcells)+y);
	for (var e = 0; e < numcells; e++) {
		check_column(e);
	}
	check_rows();
	for (n = 0; n < numrows*numcells; n++) {
		grid[n]= recurtile[n];
		}
	playit(testcolor);
	draw_grid();
	cleared_cells = recurfndx + cleared_cells;
	score_it();
	if (game_over()) {
		score = score - ((numrows*numcells) - cleared_cells)*2;
		total_score = total_score + score;
		if (numrows*numcells - cleared_cells == 0) {
			level = level + 1;
			message("You did it! Your score is " + score + " and your total so far is " + total_score + ". Advancing to level " + level);
			yay();
			}
		else {
		message("No more moves! Score is " + score + " and total score is " + total_score + ". Restarting at Level 1.");
		rats();
		level = 1;
		score = 0;
		total_score = 0;
		}
		setcookie(total_score,level);
		setTimeout("location.reload();", 3000);
	}
}

function check_column(col_num) {
	var z = create_colarray(col_num);
	var s = count_blank(z);
	if ((s > 0 ) && (s < z.length)) {//keeps it from spending time
	z = collapse_column(z);
	replace_array(z, col_num);
	}
}

function check_rows() {
	var temparray2 = new Array();
	var colcounter = 0;
	for (var i = 0; i < numcells; i++) {
		if (recurtile[(numrows-1)*numcells + i] > -1) {
			for (var j = 0; j < numrows; j++) {
			temparray2[(j*numcells) + colcounter] = recurtile[(j*numcells) + i];
			}
					colcounter++;
		}
	}
		for (var k = colcounter; k < numcells; k++) {
			for (var j = 0; j < numrows; j++) {
			temparray2[(j*numcells)+k] = -1;
		}
	}
	for (var m = 0; m < temparray2.length; m++) {
		recurtile[m] = temparray2[m];

	}
}


function create_colarray(b) {
	var cheese = new Array();
	for (var q = numrows - 1; q > -1; q--) { //this will read our column into the array backward
		cheese[cheese.length] = recurtile[q*numcells+b];
	}
	return cheese;
}

function count_blank(arr1) {
	var counter = 0;
	for (var i = 0; i < arr1.length; i++) {
	if (arr1[i] < 0) {
	counter++;
		}
	}
	return counter;
}


function reverse_array(arr) {
	var temparray = new Array();
	for (var n = arr.length-1; n > -1; n--) {
		temparray[temparray.length] = arr[n];
		}
	return temparray;
}

function collapse_column(arr) {
	var temparray1 = new Array();
	for (var n = 0; n < arr.length; n++) { //walk through the array
		if (arr[n] > -1) {
		temparray1[temparray1.length] = arr[n];
		}
	}
	var g = temparray1.length;
	for (var n = g; n < arr.length; n++) {
		temparray1[n] = -1;
	}
	arr = reverse_array(temparray1);
	return arr;
}


function replace_array(z, col_num) {
	for (var i = 0; i < z.length; i++) { //read the collapsed array backwards
		recurtile[i*numcells+col_num] = z[i];
	}
}

function recur(j) { //note new version to prevent going out of range
	var a = j; //this is the index number of the tile being tested
	recurfnd[recurfndx++] = a; //set the color
	recurtile[a] = -1; //set it to be blank
	if ((a%numcells < numcells-1) && (recurtile[a+1] == testcolor)) recur(a+1); //the additional criteria prevents it from wrapping
	if ((a%numcells > 0) && (recurtile[a-1] == testcolor)) recur(a-1);
	if ((a/numcells < numrows-1) && (recurtile[a+numcells] == testcolor)) recur(a+numcells);
	if ((a/numcells > 1) && (recurtile[a-numcells] == testcolor)) recur(a-numcells);
}

function draw_grid(){
	for (var r = 0; r < numrows; r++) {
		for (var c = 0; c < numcells; c++) {
			if (grid[r*numcells+c] < 0) document.images["t" + r + ":" + c].src = blank.src;
			else document.images["t" + r + ":" + c].src=eval("color_" + grid[r*numcells + c] + ".src");
		}
	}
}


function unlite(r,c) {

	if (grid[r*numcells+c] > -1) document.images["t" + r + ":" + c].src=eval("color_" + grid[r*numcells + c] + ".src");
}


function message(str) {
	document.panel.display.value= str;
	}

function playit(xcolor){
	if (xcolor == 0) audio.src="resources/chink.mid";
	if (xcolor == 1) audio.src="resources/timp.mid";
	if (xcolor == 2) audio.src="resources/ding.mid";
	if (xcolor == 3) audio.src="resources/tock.mid";
	if (xcolor == 4) audio.src="resources/ting.mid";
}


function rats() {
	audio.src="resources/lost.mid"
	}

function yay() {
	audio.src="resources/won.mid"
	}

</script>
